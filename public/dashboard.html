<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OKR - Esport Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        body.fullscreen {
            padding: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .controls.fullscreen {
            display: none;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .user-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .user-info h3 {
            color: #333;
            font-size: 1.4rem;
            margin-bottom: 0.3rem;
        }

        .user-stats {
            color: #666;
            font-size: 0.9rem;
        }

        .progress-section {
            margin-bottom: 1.5rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .progress-bar {
            background: #e9ecef;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s ease;
            position: relative;
            background: linear-gradient(45deg, var(--user-color), var(--user-color-light));
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.3) 50%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .okr-summary {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .okr-stat {
            text-align: center;
            padding: 0.5rem;
        }

        .okr-stat .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .okr-stat .label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
        }

        .last-update {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 3rem;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        /* Mode plein écran */
        body.fullscreen .header h1 {
            font-size: 4rem;
        }

        body.fullscreen .user-card {
            padding: 3rem;
        }

        body.fullscreen .user-avatar {
            width: 70px;
            height: 70px;
            font-size: 1.5rem;
        }

        body.fullscreen .user-info h3 {
            font-size: 2rem;
        }

        body.fullscreen .progress-bar {
            height: 30px;
        }

        body.fullscreen .okr-stat .number {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard OKR</h1>
            <p>Progression de l'équipe en temps réel</p>
        </div>

        <div class="controls" id="controls">
            <div>
                <a href="/" class="btn btn-secondary">← Retour</a>
                <button id="refreshBtn" class="btn btn-primary">🔄 Actualiser</button>
            </div>
            <div>
                <button id="fullscreenBtn" class="btn btn-secondary">📺 Mode TV</button>
                <button id="autoRefreshBtn" class="btn btn-secondary">⏱️ Auto-refresh OFF</button>
            </div>
        </div>

        <div id="dashboardContent" class="loading">
            Chargement du dashboard...
        </div>

        <div class="last-update" id="lastUpdate"></div>
    </div>

    <script>
        let autoRefreshInterval;
        let autoRefreshEnabled = false;

        // Vérifier si on est en mode plein écran
        const urlParams = new URLSearchParams(window.location.search);
        const isFullscreen = urlParams.get('fullscreen') === '1';

        if (isFullscreen) {
            document.body.classList.add('fullscreen');
            autoRefreshEnabled = true;
            startAutoRefresh();
        }

        // Charger les données du dashboard
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                const content = document.getElementById('dashboardContent');
                
                if (data.length === 0) {
                    content.innerHTML = '<div class="error">Aucun utilisateur trouvé</div>';
                    return;
                }

                content.innerHTML = `
                    <div class="dashboard-grid">
                        ${data.map(user => `
                            <div class="user-card">
                                <div class="user-header">
                                    <div class="user-avatar" style="background-color: ${user.color}">
                                        ${user.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="user-info">
                                        <h3>${user.name}</h3>
                                        <div class="user-stats">
                                            ${user.total_okrs} OKR${user.total_okrs > 1 ? 's' : ''} au total
                                        </div>
                                    </div>
                                </div>
                                <div class="progress-section">
                                    <div class="progress-label">
                                        <span>Progression</span>
                                        <span>${user.progress_percentage}%</span>
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress-fill" 
                                             style="width: ${user.progress_percentage}%; --user-color: ${user.color}; --user-color-light: ${user.color}88">
                                        </div>
                                    </div>
                                </div>
                                <div class="okr-summary">
                                    <div class="okr-stat">
                                        <div class="number">${user.completed_okrs}</div>
                                        <div class="label">Terminés</div>
                                    </div>
                                    <div class="okr-stat">
                                        <div class="number">${user.total_okrs - user.completed_okrs}</div>
                                        <div class="label">En cours</div>
                                    </div>
                                    <div class="okr-stat">
                                        <div class="number">${user.total_okrs}</div>
                                        <div class="label">Total</div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                // Mettre à jour l'heure
                document.getElementById('lastUpdate').textContent = 
                    `Dernière mise à jour : ${new Date().toLocaleTimeString('fr-FR')}`;

            } catch (error) {
                console.error('Erreur lors du chargement du dashboard:', error);
                document.getElementById('dashboardContent').innerHTML = 
                    '<div class="error">Erreur lors du chargement des données</div>';
            }
        }

        // Auto-refresh
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(loadDashboard, 30000); // 30 secondes
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // Gestionnaires d'événements
        document.getElementById('refreshBtn')?.addEventListener('click', loadDashboard);

        document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
            window.location.href = '/dashboard?fullscreen=1';
        });

        document.getElementById('autoRefreshBtn')?.addEventListener('click', function() {
            autoRefreshEnabled = !autoRefreshEnabled;
            if (autoRefreshEnabled) {
                startAutoRefresh();
                this.textContent = '⏱️ Auto-refresh ON';
                this.style.background = '#28a745';
            } else {
                stopAutoRefresh();
                this.textContent = '⏱️ Auto-refresh OFF';
                this.style.background = 'rgba(255,255,255,0.2)';
            }
        });

        // Charger au démarrage
        loadDashboard();

        // Actualiser toutes les 5 minutes en mode normal
        if (!isFullscreen) {
            setInterval(loadDashboard, 300000);
        }
    </script>
</body>
</html>
